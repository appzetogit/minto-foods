# Production web app — admin.mintofood.com
#
# Static Vite build. One SPA serves both /admin/* and /food/*, so every
# unmatched path falls through to index.html — react-router owns the URL.
#
# Port 80 only; certbot adds TLS and the redirect. See api.mintofood.com.conf.

server {
    listen 80;
    listen [::]:80;
    server_name admin.mintofood.com;

    root /srv/minto/admin;
    index index.html;

    access_log /var/log/nginx/minto-admin.access.log;
    error_log  /var/log/nginx/minto-admin.error.log;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Production is reached through Cloudflare only. Wildcard include: the guard
    # exists only after deploy/scripts/update-cloudflare-ips.sh has run, and a
    # missing include must not stop nginx starting.
    include /etc/nginx/snippets/minto-cloudflare-guard*.conf;

    # Vite fingerprints these, so a cached copy can never be the wrong build.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # The service worker and the app shell decide which build a browser runs.
    # Cached, a deploy reaches nobody until their cache happens to expire.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # This host is the admin panel: the client issued admin.mintofood.com, and
    # customers are served by the published mobile apps, not here. Left alone the
    # SPA renders its marketing landing page at /, which is not what anyone typing
    # this hostname is looking for.
    #
    # 302, not 301: a permanent redirect is cached by browsers indefinitely and
    # would be painful to walk back if a customer-facing domain is added later.
    location = / {
        return 302 /admin;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
