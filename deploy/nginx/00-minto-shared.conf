# Shared http-context config for every minto vhost.
#
# Symlink this into sites-enabled ALONGSIDE the per-host files. It must be
# loaded exactly once: upstreams, maps and limit zones are http-context
# directives, and defining the same zone name twice is a startup error.
#
#   ln -s /etc/nginx/sites-available/00-minto-shared.conf /etc/nginx/sites-enabled/

# Restores the visitor's address when Cloudflare's proxy is on. Generated by
# deploy/scripts/update-cloudflare-ips.sh; the wildcard means nginx still starts
# on a host where that has never been run, rather than failing on a missing
# include. Without it $remote_addr is a Cloudflare edge address and the rate
# limiting below buckets the entire internet into a handful of IPs.
include /etc/nginx/snippets/minto-cloudflare-realip*.conf;

# ── Production backend (PM2: deploy/ecosystem.config.cjs) ────────────────────
upstream minto_api {
    server 127.0.0.1:5000;
    keepalive 64;
}
upstream minto_socket {
    server 127.0.0.1:5001;
    keepalive 64;
}

# ── UAT backend (PM2: deploy/ecosystem.uat.config.cjs, ports +100) ───────────
upstream minto_uat_api {
    server 127.0.0.1:5100;
    keepalive 64;
}
upstream minto_uat_socket {
    server 127.0.0.1:5101;
    keepalive 64;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Separate zones per environment: a load test against UAT must not eat the
# production rate-limit budget.
limit_req_zone  $binary_remote_addr zone=minto_api_limit:10m rate=25r/s;
limit_conn_zone $binary_remote_addr zone=minto_perip:10m;
limit_req_zone  $binary_remote_addr zone=minto_uat_api_limit:10m rate=25r/s;
limit_conn_zone $binary_remote_addr zone=minto_uat_perip:10m;
