# UAT web app — uat.admin.mintofood.com
#
# Static Vite build. One SPA serves both /admin/* and /food/*, so every
# unmatched path falls through to index.html — react-router owns the URL.
#
# Port 80 only; certbot adds TLS and the redirect. See api.mintofood.com.conf.

server {
    listen 80;
    listen [::]:80;
    server_name uat.admin.mintofood.com;

    root /srv/minto-uat/admin;
    index index.html;

    access_log /var/log/nginx/minto-uat-admin.access.log;
    error_log  /var/log/nginx/minto-uat-admin.error.log;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    # Staging carries production branding; keep it out of search results.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Vite fingerprints these, so a cached copy can never be the wrong build.
    # Uploaded media is stored with RELATIVE urls ("/uploads/business/logos/x.webp"),
    # so a browser on this host resolves them against this host -- not against the
    # API. Without this they fall through to the SPA catch-all below and return
    # index.html with a 200, so images render broken while the network tab shows
    # no error at all.
    #
    # Served straight off disk rather than proxied: the files are local, and this
    # also matches dev, where Vite proxies /uploads to the backend so media stays
    # same-origin.
    location /uploads/ {
        alias /srv/minto-uat/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # The service worker and the app shell decide which build a browser runs.
    # Cached, a deploy reaches nobody until their cache happens to expire.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
