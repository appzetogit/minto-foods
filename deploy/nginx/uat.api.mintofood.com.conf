# UAT API — uat.api.mintofood.com
#
# Port 80 only, deliberately. Certbot (`--nginx`) reads this block, issues the
# certificate, then adds the `listen 443 ssl` block and the http→https redirect
# itself. Hand-writing a 443 block before the certificate exists just makes
# `nginx -t` fail and blocks the very tool that would fix it.
#
# Requires 00-minto-shared.conf (upstreams, limit zones) to be enabled.

server {
    listen 80;
    listen [::]:80;
    server_name uat.api.mintofood.com;

    # Matches UPLOAD_MAX_FILE_SIZE_MB=5, with room for multipart overhead.
    client_max_body_size 6M;
    keepalive_timeout 65;

    access_log /var/log/nginx/minto-uat-api.access.log;
    error_log  /var/log/nginx/minto-uat-api.error.log;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss image/svg+xml;

    # Unmetered: the uptime monitor polls these, and a monitor that trips the
    # rate limiter reports an outage that isn't happening.
    location = /health {
        proxy_pass http://minto_uat_api;
        include /etc/nginx/snippets/minto-proxy.conf;
        access_log off;
    }

    location = /ready {
        proxy_pass http://minto_uat_api;
        include /etc/nginx/snippets/minto-proxy.conf;
        access_log off;
    }

    # Socket.IO runs as its own single process, not in the API cluster — a
    # clustered websocket strands clients on whichever worker they didn't land on.
    location /socket.io/ {
        proxy_pass http://minto_uat_socket;
        include /etc/nginx/snippets/minto-proxy.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    # Written by the API, served by nginx — Node never reads them back. Kept
    # outside the checkout so a redeploy can't take the customers' images.
    location /uploads/ {
        alias /srv/minto-uat/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # The app is on another origin; without this the browser blocks the image.
        add_header Cross-Origin-Resource-Policy "cross-origin";
        access_log off;
        try_files $uri =404;
    }

    location /api/ {
        limit_req  zone=minto_uat_api_limit burst=60 nodelay;
        limit_conn minto_uat_perip 30;

        proxy_pass http://minto_uat_api;
        include /etc/nginx/snippets/minto-proxy.conf;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 64k;
    }

    location / {
        return 404;
    }
}
