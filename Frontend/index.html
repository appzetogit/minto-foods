<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/minto-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#12A594" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <title>MintoFood</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      /* Branded splash: shown by the HTML before any JavaScript runs, and reused by
         React (BrandSplash.jsx) while the app config loads, so the two match exactly. */
      .mf-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
        background:
          radial-gradient(120% 60% at 100% 0%, #CFF0E9 0%, rgba(207,240,233,0) 60%),
          radial-gradient(120% 60% at 0% 100%, #E7F7F3 0%, rgba(231,247,243,0) 60%),
          #ffffff;
        font-family: Outfit, Inter, system-ui, sans-serif;
      }
      .mf-splash__logo {
        width: 84px; height: 84px; border-radius: 24px;
        box-shadow: 0 18px 40px -12px rgba(11,110,99,.45);
        animation: mf-pop 1.6s cubic-bezier(.16,1,.3,1) infinite;
      }
      .mf-splash__word { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
      .mf-splash__word b { color: #0B6E63; font-weight: 800; }
      .mf-splash__word i { color: #19C9B4; font-style: normal; }
      .mf-splash__lines { display: flex; flex-direction: column; gap: 6px; width: 64px; }
      .mf-splash__lines span {
        display: block; height: 6px; border-radius: 99px;
        background: linear-gradient(90deg, #0B6E63, #19C9B4);
        transform-origin: left center;
        animation: mf-zoom 1.2s ease-in-out infinite;
      }
      .mf-splash__lines span:nth-child(1) { width: 70%; opacity: .45; margin-left: 12px; animation-delay: .15s; }
      .mf-splash__lines span:nth-child(2) { width: 55%; opacity: .7;  margin-left: 22px; animation-delay: .3s; }
      .mf-splash__lines span:nth-child(3) { width: 85%; animation-delay: 0s; }
      .mf-splash__tag { font-size: 13px; color: #5B7F7A; font-weight: 500; }
      @keyframes mf-pop { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
      @keyframes mf-zoom {
        0% { transform: translateX(-14px) scaleX(.4); opacity: 0; }
        40% { opacity: 1; }
        100% { transform: translateX(18px) scaleX(1); opacity: 0; }
      }
      /* Shimmer used by the homepage skeletons. */
      .mf-shimmer {
        background: linear-gradient(100deg, #EAF7F4 20%, #F7FCFB 40%, #EAF7F4 60%) #EAF7F4;
        background-size: 200% 100%;
        animation: mf-shimmer 1.3s linear infinite;
      }
      @keyframes mf-shimmer { from { background-position: 150% 0; } to { background-position: -50% 0; } }
      @media (prefers-reduced-motion: reduce) {
        .mf-splash__logo, .mf-splash__lines span, .mf-shimmer { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="mf-splash" role="status" aria-label="Loading MintoFood">
        <img class="mf-splash__logo" src="/minto-logo.png" alt="" />
        <div class="mf-splash__word"><b>Minto</b><i>Food</i></div>
        <div class="mf-splash__lines" aria-hidden="true"><span></span><span></span><span></span></div>
      </div>
    </div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
